// Built from numeric Date(y, m, d) like buildCalendarCells -- no string parsing.
function periodRange(id, todayStr) {
  const y = Number(todayStr.slice(0,4)), m = Number(todayStr.slice(5,7)) - 1;
  const last = (yy, mm) => new Date(yy, mm + 1, 0).getDate();
  const span = (y1, m1, y2, m2) => [toDateStr(y1, m1, 1), toDateStr(y2, m2, last(y2, m2))];
  const q = Math.floor(m / 3);
  switch (id) {
    case "last_month":   { const d = new Date(y, m - 1, 1); return span(d.getFullYear(), d.getMonth(), d.getFullYear(), d.getMonth()); }
    case "this_quarter": return span(y, q*3, y, q*3 + 2);
    case "last_quarter": { const d = new Date(y, q*3 - 3, 1); return span(d.getFullYear(), d.getMonth(), d.getFullYear(), d.getMonth() + 2); }
    case "this_year":    return span(y, 0, y, 11);
    case "last_year":    return span(y - 1, 0, y - 1, 11);
    default:             return span(y, m, y, m);
  }
}
// PostgREST caps responses (1000 rows by default); page through so totals
// never silently truncate as the ledger grows. `make` must build a fresh,
// ordered query each call.
async function fetchAll(make) {
  let all = [], from = 0;
  for (;;) {
    const { data, error } = await make().range(from, from + 999);
    if (error) return { data: null, error };
    all = all.concat(data || []);
    if (!data || data.length < 1000) return { data: all, error: null };
    from += 1000;
  }
}

// Hand-rolled SVG (no chart lib). Palette = dataviz reference slots 1-2,
// validated (CVD ΔE 24.7, all checks pass on #fff).
const CHART_BLUE = "#2a78d6";
const CHART_ORANGE = "#eb6834";
const CHART_GRID = "#eef2f5";
const CHART_INK = "#5a6b7b";

function useWidth() {
  const ref = React.useRef(null);
  const [w, setW] = useState(600);
  useEffect(() => {
    if (!ref.current) return;
    setW(ref.current.clientWidth || 600);
    if (typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver(([e]) => setW(e.contentRect.width || 600));
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  return [ref, w];
}
function niceMax(v) {
  if (v <= 0) return 1;
  const raw = v / 4, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(x => x >= raw);
  return step * 4;
}
function fmtShort(n) {
  if (Math.abs(n) >= 1000) { const k = n / 1000; return "$" + (Number.isInteger(k) ? k : k.toFixed(1)) + "k"; }
  return "$" + Math.round(n);
}
// rounded top corners (4px) on the data end, square at the baseline
function colPath(x, y, w, h) {
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function barPath(x, y, w, h) { // horizontal: rounded right end
  const r = Math.min(4, h / 2, w);
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
}

function ColumnChart({ labels, series, height = 220, extra }) {
  const [ref, width] = useWidth();
  const [hover, setHover] = useState(null);
  const m = { t: 10, r: 6, b: 26, l: 46 };
  const pw = Math.max(50, width - m.l - m.r), ph = height - m.t - m.b;
  const max = niceMax(Math.max(0, ...series.flatMap(s => s.values)));
  const y = v => m.t + ph - (v / max) * ph;
  const gw = pw / labels.length, k = series.length;
  const bw = Math.max(4, Math.min(24, (gw - 10 - (k - 1) * 2) / k));
  const gx = i => m.l + i * gw + (gw - (bw * k + (k - 1) * 2)) / 2;
  const ticks = [0, 1, 2, 3, 4].map(i => (max / 4) * i);
  return (
    <div className="chart" ref={ref}>
      {k > 1 && <div className="chart-legend">{series.map(s => <span key={s.name}><i style={{background:s.color}}></i>{s.name}</span>)}</div>}
      <svg width="100%" height={height} role="img" aria-label={series.map(s => s.name).join(" vs ")} onMouseLeave={() => setHover(null)}>
        {ticks.map(t => (
          <g key={t}>
            <line x1={m.l} x2={m.l + pw} y1={y(t)} y2={y(t)} stroke={CHART_GRID} strokeWidth="1" />
            <text x={m.l - 8} y={y(t) + 4} textAnchor="end" fontSize="10" fill={CHART_INK}>{fmtShort(t)}</text>
          </g>
        ))}
        {labels.map((lab, i) => (
          <g key={lab + i}>
            {hover === i && <rect x={m.l + i * gw + 2} y={m.t} width={gw - 4} height={ph} fill="#f4f8fb" rx="4" />}
            {series.map((s, j) => {
              const v = s.values[i];
              if (!(v > 0)) return null;
              const h = Math.max(1, ph * v / max);
              return <path key={s.name} d={colPath(gx(i) + j * (bw + 2), m.t + ph - h, bw, h)} fill={s.color} />;
            })}
            <text x={m.l + i * gw + gw / 2} y={height - 8} textAnchor="middle" fontSize="10" fill={CHART_INK}>{lab}</text>
            <rect x={m.l + i * gw} y={m.t} width={gw} height={ph + m.b} fill="transparent"
              onMouseEnter={() => setHover(i)} onTouchStart={() => setHover(i)} />
          </g>
        ))}
      </svg>
      {hover !== null && (
        <div className="chart-tip" style={{ left: Math.min(Math.max(0, m.l + hover * gw + gw / 2 - 70), width - 160), top: 30 }}>
          <div style={{fontWeight:600,marginBottom:4}}>{labels[hover]}</div>
          {series.map(s => (
            <div key={s.name} className="row"><span className="key"><i style={{background:s.color}}></i>{s.name}</span><span>{fmtMoney(s.values[hover])}</span></div>
          ))}
          {extra && extra(hover)}
        </div>
      )}
    </div>
  );
}

function HBarChart({ rows, max: cap = 8, color = CHART_BLUE }) {
  const [ref, width] = useWidth();
  const [hover, setHover] = useState(null);
  const sorted = [...rows].filter(r => r.value > 0).sort((a, b) => b.value - a.value);
  const shown = sorted.length > cap
    ? [...sorted.slice(0, cap - 1), { label: `Other (${sorted.length - cap + 1})`, value: sorted.slice(cap - 1).reduce((t, r) => t + r.value, 0) }]
    : sorted;
  const total = sorted.reduce((t, r) => t + r.value, 0);
  if (shown.length === 0) return <div className="chart-empty">Nothing to chart for this period yet.</div>;
  const lw = Math.min(170, width * 0.38), vw = 78, rh = 30, bh = 16;
  const pw = Math.max(40, width - lw - vw - 36);
  const top = shown[0].value;
  const trunc = t => t.length > 24 ? t.slice(0, 23) + "…" : t;
  return (
    <div className="chart" ref={ref}>
      <svg width="100%" height={shown.length * rh + 4} role="img" aria-label="Ranked bar chart" onMouseLeave={() => setHover(null)}>
        {shown.map((r, i) => {
          const w = Math.max(2, pw * r.value / top), yy = i * rh + (rh - bh) / 2;
          return (
            <g key={r.label} onMouseEnter={() => setHover(i)} onTouchStart={() => setHover(i)}>
              <rect x="0" y={i * rh} width={width - 36} height={rh} fill={hover === i ? "#f4f8fb" : "transparent"} rx="4" />
              <text x={lw - 10} y={yy + bh - 4} textAnchor="end" fontSize="12" fill="#2C3E50">{trunc(r.label)}</text>
              <path d={barPath(lw, yy, w, bh)} fill={color} />
              <text x={lw + w + 6} y={yy + bh - 4} fontSize="11" fill={CHART_INK}>{fmtShort(r.value)}</text>
            </g>
          );
        })}
      </svg>
      {hover !== null && (
        <div className="chart-tip" style={{ left: Math.min(lw, width - 170), top: hover * rh + rh + 4 }}>
          <div style={{fontWeight:600,marginBottom:4}}>{shown[hover].label}</div>
          <div className="row"><span className="key">Amount</span><span>{fmtMoney(shown[hover].value)}</span></div>
          <div className="row"><span className="key">Share</span><span>{total ? Math.round(shown[hover].value / total * 100) : 0}%</span></div>
        </div>
      )}
    </div>
  );
}

function lineTotals(lines, taxRate) {
  const r2 = n => Math.round(n * 100) / 100;
  let subtotal = 0, taxable = 0;
  lines.forEach(l => {
    const amt = r2((Number(l.quantity) || 0) * (Number(l.unit_price) || 0));
    subtotal += amt; if (l.taxable) taxable += amt;
  });
  subtotal = r2(subtotal); taxable = r2(taxable);
  const tax = r2(taxable * taxRate);
  return { subtotal, taxable, tax, total: r2(subtotal + tax) };
}

function fmtDateY(d) {
  if (!d) return "";
  return new Date(d + "T12:00:00").toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
}

function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d + "T12:00:00");
  return dt.toLocaleDateString("en-US", { month:"short", day:"numeric" });
}

function toDateStr(y, m, day) {
  return `${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}

// Built entirely from the numeric Date(y, m, day) constructor -- never
// string-parsed -- so unlike the "date + T12:00:00" idiom used elsewhere
// in this file (which exists specifically to dodge timezone ambiguity
// when parsing a stored "YYYY-MM-DD" string), there's no ambiguity here
// to dodge in the first place. Don't "fix" this by adding T12:00:00.
function buildCalendarCells(monthDate) {
  const y = monthDate.getFullYear();
  const m = monthDate.getMonth();
  const firstWeekday = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const totalCells = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;
  return Array.from({ length: totalCells }, (_, i) => {
    const dayNum = i - firstWeekday + 1;
    if (dayNum < 1 || dayNum > daysInMonth) return null;
    return toDateStr(y, m, dayNum);
  });
}

function colorFor(id) {
  if (!id) return PALETTE[0];
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) | 0;
  return PALETTE[Math.abs(hash) % PALETTE.length];
}

// Reusable client picker: select an existing client, or add a brand-new one
// inline (no dedicated client-creation screen in v1).
// ── ADDRESS SUGGESTIONS ─────────────────────────────────────────────
// Free type-ahead via Photon (OpenStreetMap data, no API key, CORS-open).
// Biased toward Somers Point NJ and boxed to the NJ/PA/DE/NY/MD region
// where Janna works. Purely a convenience: the input stays free text, so
// if Photon is down or slow, typing an address by hand still works.
const PHOTON_URL = "https://photon.komoot.io/api/";
const PHOTON_BIAS = { lat: 39.3176, lon: -74.5946 };
const PHOTON_BBOX = "-80.6,38.4,-73.5,42.6";
const STATE_ABBR = {
  "New Jersey":"NJ","Pennsylvania":"PA","Delaware":"DE","New York":"NY","Maryland":"MD",
};

function formatPhotonAddress(pr) {
  const street = pr.street && pr.housenumber ? `${pr.housenumber} ${pr.street}`
    : pr.street ? pr.street
    : pr.name;
  if (!street) return null;
  const town = pr.city || pr.town || pr.village || pr.locality || pr.district || pr.county;
  const state = STATE_ABBR[pr.state] || pr.state;
  const tail = [state, pr.postcode].filter(Boolean).join(" ");
  return [street, town, tail].filter(Boolean).join(", ");
}

function AddressInput({ value, onChange, placeholder }) {
  const [items, setItems] = useState([]);
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState(-1);
  const timer = useRef(null);
  const ctrl = useRef(null);

  useEffect(() => () => { clearTimeout(timer.current); ctrl.current?.abort(); }, []);

  function lookup(q) {
    clearTimeout(timer.current);
    ctrl.current?.abort();
    if (q.trim().length < 4) { setItems([]); setOpen(false); return; }
    timer.current = setTimeout(async () => {
      const ac = new AbortController();
      ctrl.current = ac;
      try {
        const url = `${PHOTON_URL}?q=${encodeURIComponent(q)}&limit=8&lang=en`
          + `&lat=${PHOTON_BIAS.lat}&lon=${PHOTON_BIAS.lon}&bbox=${PHOTON_BBOX}`;
        const res = await fetch(url, { signal: ac.signal });
        if (!res.ok) return;
        const json = await res.json();
        const seen = new Set();
        const out = [];
        for (const f of json.features || []) {
          const label = formatPhotonAddress(f.properties || {});
          if (label && !seen.has(label)) { seen.add(label); out.push(label); }
          if (out.length === 5) break;
        }
        setItems(out);
        setActive(-1);
        setOpen(out.length > 0);
      } catch (e) {
        if (e.name !== "AbortError") console.warn("Address lookup failed:", e.message);
      }
    }, 300);
  }

  function pick(label) {
    onChange(label);
    setItems([]);
    setOpen(false);
  }

  function onKeyDown(e) {
    if (!open || items.length === 0) return;
    if (e.key === "ArrowDown") { e.preventDefault(); setActive(i => (i + 1) % items.length); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(i => (i <= 0 ? items.length - 1 : i - 1)); }
    else if (e.key === "Enter" && active >= 0) { e.preventDefault(); pick(items[active]); }
    else if (e.key === "Escape") { setOpen(false); }
  }

  return (
    <div className="addr-wrap">
      <input className="form-input" value={value} placeholder={placeholder} autoComplete="off"
        onChange={e => { onChange(e.target.value); lookup(e.target.value); }}
        onKeyDown={onKeyDown}
        onFocus={() => { if (items.length) setOpen(true); }}
        onBlur={() => setTimeout(() => setOpen(false), 150)} />
      {open && (
        <div className="addr-list">
          {items.map((label, i) => (
            <div key={label} className={`addr-item${i === active ? " active" : ""}`}
              onMouseDown={e => { e.preventDefault(); pick(label); }}>
              📍 {label}
            </div>
          ))}
          <div className="addr-credit">© OpenStreetMap</div>
        </div>
      )}
    </div>
  );
}

// One-way autofill only: picking a saved property just copies its address
// text into the free-text "Job Site Address" input below. There is no FK
// from jobs to properties -- jobs.address stays denormalized at booking
// time, exactly like jobs.cleaner, so later edits/deletes of a property
// never retroactively touch already-booked jobs.
function SavedPropertyPicker({ properties, form, setForm }) {
  if (!form.client_id || form.client_id === NEW_CLIENT_VALUE) return null;
  const matches = properties.filter(p => p.client_id === form.client_id);
  if (matches.length === 0) return null;
  return (
    <div className="form-group">
      <label className="form-label">Saved Property</label>
      <select className="form-select" value=""
        onChange={e => {
          const p = matches.find(m => m.id === e.target.value);
          if (p) setForm(prev => ({ ...prev, address: p.address }));
        }}>
        <option value="">Choose a saved address to autofill…</option>
        {matches.map(p => (
          <option key={p.id} value={p.id}>{p.label ? `${p.label} — ${p.address}` : p.address}</option>
        ))}
      </select>
    </div>
  );
}

function PassphraseGate({ onUnlock }) {
  const [value, setValue] = useState("");
  const [error, setError] = useState("");

  function submit(e) {
    e.preventDefault();
    if (value === APP_PASSPHRASE) {
      onUnlock();
    } else {
      setError("Incorrect passphrase");
    }
  }

  return (
    <>
      <style>{styles}</style>
      <div className="gate-screen">
        <form className="gate-card" onSubmit={submit}>
          <div className="gate-icon">🧹</div>
          <div className="gate-title">Janna's Cleaning Service</div>
          <div className="gate-sub">Enter the team passphrase to unlock this device</div>

}

  async function loadAll({ silent = false } = {}) {

      setJobs((jobsRes.data || []).map(j => ({ ...j, client: j.clients?.name || "Unknown" })));
      setNotes((notesRes.data || []).map(n => ({ ...n, client: n.clients?.name || "Unknown" })));
      setCleaners(cleanersRes.data || []);
      setProperties(propertiesRes.data || []);

      // Financial tables are owner-only in RLS (no anon policy), so only
      // fetch them with a signed-in session.
      const { data: { session: s } } = await supabase.auth.getSession();
      if (s) {
        const [invRes, itemsRes, payRes, ledRes, acctRes, expRes] = await Promise.all([

          supabase.from('accounts').select('*').order('code'),
          fetchAll(() => supabase.from('expenses').select('*').order('expense_date', { ascending:false }).order('id')),
        ]);
        for (const r of [invRes, itemsRes, payRes, ledRes, acctRes, expRes]) if (r.error) throw r.error;

        setInvoiceItems(itemsRes.data || []);

        setAccounts(acctRes.data || []);
        setExpenses(expRes.data || []);

      showNotif("⚠️ Failed to load data: " + err.message);

      setLoading(false);

  useEffect(() => { if (authReady) loadAll(); }, [authReady, sessionUserId]);

  async function handleAddSelfCleaner(name) {
    try {
      const { data, error } = await supabase.from('cleaners').insert({ name, active: true }).select().single();
      if (error) throw error;
      setCleaners(p => [...p, data].sort((a,b) => a.name.localeCompare(b.name)));

  if (!trusted) {

  }

        }} />

    if (!isOwner) { showNotif("⚠️ Only Janna can do that"); return false; }

    { id:"dashboard", icon:"🏠", label:"Dashboard" },
    { id:"jobs",      icon:"📋", label:"Jobs" },
    { id:"schedule",  icon:"📅", label:"Schedule" },
    { id:"clients",   icon:"👥", label:"Clients" },
    { id:"notes",     icon:"📝", label:"Notes" },
    ...(isOwner ? [{ id:"invoices", icon:"🧾", label:"Invoices" }] : []),
    ...(isOwner ? [{ id:"books", icon:"📊", label:"Books" }] : []),
    ...(isOwner ? [{ id:"team", icon:"🧺", label:"Team" }] : []),
  ];

  const pageTitles = {
    dashboard: "Good morning, Janna ☀️",
    jobs: "Jobs",
    schedule: "Schedule",

  };

  // ── STATS ──────────────────────────────────────────────────────
  const todayStr = new Date().toISOString().split('T')[0];
  const todayJobs = jobs.filter(j => j.date === todayStr && j.status !== "cancelled");
  const scheduledJobs = jobs.filter(j => j.status === "scheduled");
  const completedJobs = jobs.filter(j => j.status === "completed");
  const pendingJobs = jobs.filter(j => j.status === "pending");

  // ── FILTERED JOBS ─────────────────────────────────────────────
  const filteredJobs = jobs.filter(j => {
    const matchStatus = statusFilter === "all" ? (j.status !== "completed" && j.status !== "cancelled") : j.status === statusFilter;
    const q = searchQ.toLowerCase();
    const matchSearch = !q || (j.client||"").toLowerCase().includes(q) || (j.address||"").toLowerCase().includes(q) || (j.type||"").toLowerCase().includes(q);
    return matchStatus && matchSearch;
  });

  // ── SCHEDULE (group by date) ──────────────────────────────────
  const scheduleDays = {};
  [...jobs].filter(j => j.status !== "cancelled").sort((a,b) => a.date.localeCompare(b.date)).forEach(j => {

  async function resolveClientId(form) {
    if (form.client_id === NEW_CLIENT_VALUE) {
      if (!form.newClientName.trim()) throw new Error("New client name is required");
      const { data, error } = await supabase.from('clients').insert({
        name: form.newClientName.trim(),
        phone: form.newClientPhone || null,
        email: form.newClientEmail || null,
        address: form.newClientAddress || null,
      }).select().single();
      if (error) throw error;
      setClients(p => [...p, data].sort((a,b) => a.name.localeCompare(b.name)));

      if (form.newClientAddress && form.newClientAddress.trim()) {
        try {
          const { data: prop, error: propErr } = await supabase.from('properties').insert({
            client_id: data.id, label: null, address: form.newClientAddress.trim(),
          }).select().single();
          if (propErr) throw propErr;
          setProperties(p => [...p, prop]);
        } catch (propErr) {
          // Non-fatal: the client's own `address` column already has this
          // text; failing to also seed a `properties` row shouldn't block
          // booking the job/note that triggered client creation.
          console.warn("Failed to auto-seed property:", propErr.message);
        }
      }

      return data.id;
    }
    if (!form.client_id) throw new Error("Client is required");
    return form.client_id;
  }

  function resetClientForm() { setClientForm(EMPTY_CLIENT_FORM); }

  // ── CLIENTS ──────────────────────────────────────────────────────
  async function handleAddClient() {
    if (!requireOwner()) return;
    if (!clientForm.name.trim()) { showNotif("⚠️ Name is required"); return; }
    try {
      const { data, error } = await supabase.from('clients').insert({
        name: clientForm.name.trim(),
        phone: clientForm.phone || null,
        email: clientForm.email || null,
        address: clientForm.address || null,
      }).select().single();
      if (error) throw error;

      setClients(p => [...p, data].sort((a,b) => a.name.localeCompare(b.name)));

      if (clientForm.address && clientForm.address.trim()) {
        try {
          const { data: prop, error: propErr } = await supabase.from('properties').insert({
            client_id: data.id, label: null, address: clientForm.address.trim(),
          }).select().single();
          if (propErr) throw propErr;
          setProperties(p => [...p, prop]);
        } catch (propErr) {
          console.warn("Failed to auto-seed property:", propErr.message);
        }
      }

      setShowClientModal(false);
      resetClientForm();
      showNotif("✓ Client added");
    } catch (err) {
      showNotif("⚠️ " + err.message);
    }

  async function handleEditClientSave() {
    if (!requireOwner()) return;
    if (!editClient.name.trim()) { showNotif("⚠️ Name is required"); return; }
    try {
      const { data, error } = await supabase.from('clients').update({
        name: editClient.name.trim(),
        phone: editClient.phone || null,
        email: editClient.email || null,
        address: editClient.address || null,

      if (error) throw error;

      setClients(p => p.map(c => c.id === data.id ? data : c).sort((a,b) => a.name.localeCompare(b.name)));
      setJobs(p => p.map(j => j.client_id === data.id ? { ...j, client: data.name } : j));
      setNotes(p => p.map(n => n.client_id === data.id ? { ...n, client: data.name } : n));

      // Same non-fatal auto-seed as handleAddClient: a client given an
      // address here with no saved properties yet gets it as their first one.
      if (data.address && data.address.trim() && !properties.some(pr => pr.client_id === data.id)) {
        try {
          const { data: prop, error: propErr } = await supabase.from('properties').insert({
            client_id: data.id, label: null, address: data.address.trim(),

      const { error } = await supabase.from('properties').delete().eq('id', id);
      if (error) throw error;
      setProperties(p => p.filter(pr => pr.id !== id));
      showNotif("🗑 Property removed");
    } catch (err) {
      showNotif("⚠️ " + err.message);
    }
  }

  // ── BOOK JOB ──────────────────────────────────────────────────
  async function handleBook() {
    if (!requireOwner()) return;
    if (!bookForm.date) { showNotif("⚠️ Client and date are required"); return; }
    try {
      const clientId = await resolveClientId(bookForm);
      const { data, error } = await supabase.from('jobs').insert({
        client_id: clientId,
        address: bookForm.address,
        type: bookForm.type,
        recurring: bookForm.recurring,
        status: bookForm.status,
        date: bookForm.date,
        time: bookForm.time,
        cleaner: bookForm.cleaner,
        notes: bookForm.notes,
        price: toPrice(bookForm.price),
      }).select('*, clients(id,name)').single();
      if (error) throw error;

      setJobs(p => [...p, { ...data, client: data.clients?.name || "Unknown" }]);
      setShowBookModal(false);
      resetBookForm();
      showNotif("✓ Job booked successfully");
    } catch (err) {
      showNotif("⚠️ " + err.message);
    }

  async function handleSignIn() {
    const { email, password, mode } = signInForm;
    if (!email.trim() || !password) { setSignInForm(p => ({ ...p, msg:"⚠️ Email and password are required" })); return; }
    setSignInForm(p => ({ ...p, busy:true, msg:"" }));
    try {
      if (mode === "signup") {
        const { data, error } = await supabase.auth.signUp({
          email: email.trim(), password, options: { emailRedirectTo: window.location.origin },
        });
        if (error) throw error;
        if (!data.session) {
          setSignInForm(p => ({ ...p, busy:false, mode:"signin", password:"",
            msg:`✉️ Check ${email.trim()} for a confirmation link, click it, then come back and sign in here.` }));
          return;
        }
      } else {
        const { error } = await supabase.auth.signInWithPassword({ email: email.trim(), password });
        if (error) throw error;
      }
      // A signed-in user who isn't the linked owner would see NOTHING (the
      // anon policies stop applying once you're "authenticated"), so verify
      // and back out instead of blanking the app.
      const { data: ok, error: rpcErr } = await supabase.rpc('is_owner');
      if (rpcErr || !ok) {
        await supabase.auth.signOut();
        throw new Error(`That login isn't linked to the owner. Use the owner's email${ownerEmail ? ` (${ownerEmail})` : ""}.`);
      }
      setShowSignIn(false);
      showNotif("✓ Signed in — invoices unlocked");
    } catch (err) {
      setSignInForm(p => ({ ...p, busy:false, msg: "⚠️ " + err.message }));
    }
  }

  const renderInvoices = () => {

        <div className="card">

    const year = todayStr.slice(0,4);

    const open = rows.filter(r => r.st !== "paid" && r.st !== "void");
    const outstanding = open.reduce((t, r) => t + Number(r.balance_due), 0);

  // General Ledger: per account, opening balance → entries in period → closing.
  // Balances use each account's normal side (assets/expenses = debit).
  const renderLedger = (from, to, acctById) => {
    const invById = Object.fromEntries(invoices.map(i => [i.id, i]));
    const normalDebit = a => a.type === "asset" || a.type === "expense";
    const signed = (a, l) => normalDebit(a) ? Number(l.debit) - Number(l.credit) : Number(l.credit) - Number(l.debit);
    const accts = accounts.filter(a => glAccount === "all" || a.id === glAccount);
    const inPeriod = ledger.filter(l => l.entry_date >= from && l.entry_date <= to);
    const totDr = inPeriod.reduce((t, l) => t + Number(l.debit), 0);
    const totCr = inPeriod.reduce((t, l) => t + Number(l.credit), 0);
    const allDr = ledger.reduce((t, l) => t + Number(l.debit), 0), allCr = ledger.reduce((t, l) => t + Number(l.credit), 0);
    const balanced = Math.abs(totDr - totCr) < 0.005 && Math.abs(allDr - allCr) < 0.005;
    const r2 = n => Math.round(n * 100) / 100;
    const sections = accts.map(a => {
      const opening = ledger.filter(l => l.account_id === a.id && l.entry_date < from).reduce((t, l) => t + signed(a, l), 0);
      const rows = inPeriod.filter(l => l.account_id === a.id)
        .sort((x, y) => x.entry_date.localeCompare(y.entry_date) || (x.created_at || "").localeCompare(y.created_at || ""));
      let run = opening;
      const lines = rows.map(l => { run += signed(a, l); return { l, bal: run }; });
      return { a, opening, lines, closing: run };
    }).filter(sct => glAccount !== "all" || sct.lines.length || Math.abs(sct.opening) > 0.004);
    const refFor = l => {
      if (l.invoice_id && invById[l.invoice_id]) return invById[l.invoice_id].invoice_number;
      return "";
    };
    return (
      <div className="print-area">
        <div className="card">
          <div className="card-header">
            <div className="card-title">General Ledger</div>
            <span style={{fontSize:12,color:"var(--slate-mid)"}}>{BUSINESS.name} · {fmtDateY(from)} – {fmtDateY(to)} · accrual basis</span>
          </div>
          <div style={{padding:"10px 18px",fontSize:13,display:"flex",gap:18,flexWrap:"wrap",borderBottom:"1px solid #eef2f5"}}>
            <span>Period debits <b>{fmtMoney(totDr)}</b></span>
            <span>Period credits <b>{fmtMoney(totCr)}</b></span>
            <span style={{color: balanced ? "#2E7A4F" : "var(--coral)", fontWeight:600}}>
              {balanced ? "✓ Books balance (debits = credits)" : "⚠️ Out of balance — tell Claude"}
            </span>
            {sections.length > 1 && (
              <span className="no-print" style={{marginLeft:"auto",display:"flex",gap:8}}>
                <button className="btn btn-ghost" style={{padding:"4px 10px",fontSize:12}}
                  onClick={() => setGlOpen(Object.fromEntries(sections.map(sct => [sct.a.id, true])))}>Expand all</button>
                <button className="btn btn-ghost" style={{padding:"4px 10px",fontSize:12}}
                  onClick={() => setGlOpen(Object.fromEntries(sections.map(sct => [sct.a.id, false])))}>Collapse all</button>
              </span>
            )}
          </div>
        </div>
        {sections.length === 0 && <div className="card"><div className="empty"><div className="empty-icon">📒</div><div className="empty-text">No activity in this period</div></div></div>}
        {sections.map(({ a, opening, lines, closing }) => {
          // Collapsed by default when viewing all accounts; a single picked account opens itself.
          const isOpen = glOpen[a.id] ?? (glAccount !== "all");
          return (
          <div className="card" key={a.id}>
            <div className="card-header gl-head" role="button" aria-expanded={isOpen}
              onClick={() => setGlOpen(o => ({ ...o, [a.id]: !isOpen }))}
              style={isOpen ? undefined : {borderBottom:"none"}}>
              <div className="card-title" style={{fontSize:17}}>
                <span className={`gl-chev ${isOpen ? "open" : ""}`}>▸</span>{a.code} · {a.name}
              </div>
              <span style={{fontSize:12,color:"var(--slate-mid)",textAlign:"right"}}>
                {a.type} · {lines.length} entr{lines.length === 1 ? "y" : "ies"} · <b>{fmtMoney(r2(closing))}</b>
              </span>
            </div>
            <div className={isOpen ? "" : "gl-closed"}>
            <table className="rpt">
              <thead><tr><th>Date</th><th>Description</th><th>Ref</th><th className="num">Debit</th><th className="num">Credit</th><th className="num">Balance</th></tr></thead>
              <tbody>
                <tr className="sub"><td colSpan={5}>Opening balance</td><td className="num">{fmtMoney(r2(opening))}</td></tr>
                {lines.map(({ l, bal }) => (
                  <tr key={l.id} style={l.invoice_id ? {cursor:"pointer"} : undefined} onClick={l.invoice_id ? () => setViewInvoiceId(l.invoice_id) : undefined}>
                    <td style={{whiteSpace:"nowrap"}}>{fmtDate(l.entry_date)}</td>
                    <td>{l.memo}</td>
                    <td style={{color:"var(--slate-mid)",whiteSpace:"nowrap"}}>{refFor(l)}</td>
                    <td className="num">{Number(l.debit) ? fmtMoney(l.debit) : ""}</td>
                    <td className="num">{Number(l.credit) ? fmtMoney(l.credit) : ""}</td>
                    <td className={`num ${bal < -0.004 ? "neg" : ""}`}>{fmtMoney(r2(bal))}</td>
                  </tr>
                ))}
                <tr className="total"><td colSpan={5}>Closing balance</td><td className="num">{fmtMoney(r2(closing))}</td></tr>
              </tbody>
            </table>
            </div>
          </div>
          );
        })}
      </div>
    );
  };

  const renderBooks = () => {
    if (!session) {
      return (
        <div className="card">
          <div className="empty">
            <div className="empty-icon">🔒</div>
            <div className="empty-text" style={{marginBottom:14}}>The books are protected. Sign in with the owner account to see them.</div>
            <button className="btn btn-primary" onClick={openSignIn}>Sign in as owner</button>
          </div>
        </div>
      );
    }
    const [from, to] = periodRange(booksPeriod, todayStr);
    const inRange = d => d >= from && d <= to;
    const acctById = Object.fromEntries(accounts.map(a => [a.id, a]));
    const invById = Object.fromEntries(invoices.map(i => [i.id, i]));
    const cash = booksBasis === "cash";
    const r2 = n => Math.round(n * 100) / 100;

    // months in the period, for the breakdown table
    const months = [];
    for (let d = new Date(Number(from.slice(0,4)), Number(from.slice(5,7)) - 1, 1); toDateStr(d.getFullYear(), d.getMonth(), 1) <= to; d = new Date(d.getFullYear(), d.getMonth() + 1, 1))
      months.push(toDateStr(d.getFullYear(), d.getMonth(), 1).slice(0,7));
    const byMonth = Object.fromEntries(months.map(m => [m, { rev:0, exp:0 }]));

    // Revenue: accrual = 4000 ledger (when invoiced); cash = pre-tax share of payments (when paid)
    let revenue = 0;
    if (cash) {
      payments.filter(p => inRange(p.paid_date)).forEach(p => {
        const inv = invById[p.invoice_id];
        const share = inv && Number(inv.total) > 0 ? Number(inv.subtotal) / Number(inv.total) : 0;
        const amt = Number(p.amount) * share;
        revenue += amt; if (byMonth[monthKey(p.paid_date)]) byMonth[monthKey(p.paid_date)].rev += amt;
      });
    } else {
      ledger.filter(l => acctById[l.account_id]?.code === "4000" && inRange(l.entry_date)).forEach(l => {
        const amt = Number(l.credit) - Number(l.debit);
        revenue += amt; if (byMonth[monthKey(l.entry_date)]) byMonth[monthKey(l.entry_date)].rev += amt;
      });
    }
    // Expenses (paid from bank immediately, so the same on both bases)
    const expByAcct = {};
    ledger.filter(l => acctById[l.account_id]?.type === "expense" && inRange(l.entry_date)).forEach(l => {
      const amt = Number(l.debit) - Number(l.credit);
      const a = acctById[l.account_id];
      expByAcct[a.code] = { name: a.name, amt: (expByAcct[a.code]?.amt || 0) + amt };
      if (byMonth[monthKey(l.entry_date)]) byMonth[monthKey(l.entry_date)].exp += amt;
    });
    const totalExp = Object.values(expByAcct).reduce((t, x) => t + x.amt, 0);
    // Revenue by client (same basis as the P&L)
    const revByClient = {};
    if (cash) {
      payments.filter(p => inRange(p.paid_date)).forEach(p => {
        const inv = invById[p.invoice_id];
        if (!inv || !(Number(inv.total) > 0)) return;
        revByClient[inv.client_id] = (revByClient[inv.client_id] || 0) + Number(p.amount) * Number(inv.subtotal) / Number(inv.total);
      });
    } else {
      invoices.filter(i => inRange(i.invoice_date)).forEach(i => { revByClient[i.client_id] = (revByClient[i.client_id] || 0) + Number(i.subtotal); });
    }
    const clientRows = Object.entries(revByClient).map(([id, v]) => ({ label: clientById(id)?.name || "Unknown", value: r2(v) }));
    const net = revenue - totalExp;

    // Sales tax by quarter for the period's year
    const year = from.slice(0,4);
    const quarters = [0,1,2,3].map(q => {
      const [qs, qe] = [toDateStr(Number(year), q*3, 1), toDateStr(Number(year), q*3 + 2, new Date(Number(year), q*3 + 3, 0).getDate())];
      const inQ = d => d >= qs && d <= qe;
      const qInv = invoices.filter(i => inQ(i.invoice_date));
      const collected = payments.filter(p => inQ(p.paid_date)).reduce((t, p) => {
        const inv = invById[p.invoice_id];
        return t + (inv && Number(inv.total) > 0 ? Number(p.amount) * Number(inv.tax_amount) / Number(inv.total) : 0);
      }, 0);
      // attribute each payment to the quarter it covers (tax_period), else by date paid
      const qLabel = `Q${q+1} ${year}`;
      const paidNJ = expenses.filter(x => acctById[x.account_id]?.code === "2100" && (x.tax_period ? x.tax_period === qLabel : inQ(x.expense_date)))
        .reduce((t, x) => t + Number(x.amount), 0);
      return { label:`Q${q+1} ${year}`, taxable: qInv.reduce((t,i)=>t+Number(i.taxable_amount),0),
        charged: qInv.reduce((t,i)=>t+Number(i.tax_amount),0), collected, paidNJ };
    });
    const taxOwed = ledger.filter(l => acctById[l.account_id]?.code === "2100").reduce((t, l) => t + Number(l.credit) - Number(l.debit), 0);
    const periodExpenses = expenses.filter(x => inRange(x.expense_date) && acctById[x.account_id]?.code !== "2100");
    const taxPayments = expenses.filter(x => acctById[x.account_id]?.code === "2100" && (x.tax_period ? x.tax_period.endsWith(year) : x.expense_date.startsWith(year)));
    const quarterOptions = [];
    for (let yy = Number(todayStr.slice(0,4)); yy >= Number(todayStr.slice(0,4)) - 1; yy--) for (let qq = 4; qq >= 1; qq--) quarterOptions.push(`Q${qq} ${yy}`);
    const curQ = Math.floor((Number(todayStr.slice(5,7)) - 1) / 3);
    const lastQLabel = curQ === 0 ? `Q4 ${Number(todayStr.slice(0,4)) - 1}` : `Q${curQ} ${todayStr.slice(0,4)}`;
    const periodLabel = BOOKS_PERIODS.find(p => p.id === booksPeriod)?.label;

    return (
      <>
        <div className="books-bar no-print">
          <div className="filter-tabs" style={{border:"none",padding:0}}>
            {[["summary","📊 Summary"],["ledger","📒 General Ledger"]].map(([v,l]) => (
              <button key={v} className={`filter-tab ${booksView===v?"active":""}`} onClick={()=>setBooksView(v)}>{l}</button>
            ))}
          </div>
          <select className="form-select" value={booksPeriod} onChange={e=>setBooksPeriod(e.target.value)}>
            {BOOKS_PERIODS.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
          </select>
          {booksView === "ledger" && (
            <select className="form-select" value={glAccount} onChange={e=>setGlAccount(e.target.value)}>
              <option value="all">All accounts</option>
              {accounts.map(a => <option key={a.id} value={a.id}>{a.code} · {a.name}</option>)}
            </select>
          )}
          {booksView === "summary" && <div className="filter-tabs" style={{border:"none",padding:0}}>
            {["accrual","cash"].map(b => (
              <button key={b} className={`filter-tab ${booksBasis===b?"active":""}`} onClick={()=>setBooksBasis(b)}>
                {b === "accrual" ? "Accrual (when invoiced)" : "Cash (when paid)"}
              </button>
            ))}
          </div>}
          <button className="btn btn-ghost" style={{marginLeft:"auto"}} onClick={()=>window.print()}>🖨 Print / PDF</button>
        </div>

        {booksView === "ledger" ? renderLedger(from, to, acctById) : (
        <div className="print-area">
          <div className="stats-grid">
            {[
              { label:"Revenue", value: fmtMoney(revenue), sub: cash ? "Collected (excl. tax)" : "Invoiced (excl. tax)", accent:"#E8F5EE" },
              { label:"Expenses", value: fmtMoney(totalExp), sub:`${periodExpenses.length} entries`, accent:"#FEF0EC" },
              { label:"Net Profit", value: fmtMoney(net), sub: periodLabel, accent:"#E8F4F8" },
              { label:"Sales Tax Owed", value: fmtMoney(taxOwed), sub:"Collected, not yet paid to NJ", accent:"#FFF8EC" },
            ].map((st,i) => (
              <div key={i} className="stat-card" style={{"--accent":st.accent}}>
                <div className="stat-label">{st.label}</div>
                <div className="stat-value money">{st.value}</div>
                <div className="stat-sub">{st.sub}</div>
              </div>
            ))}
          </div>

          {months.length > 1 && (
            <div className="card">
              <div className="card-header">
                <div className="card-title">Revenue vs Expenses</div>
                <span style={{fontSize:12,color:"var(--slate-mid)"}}>by month · hover for net</span>
              </div>
              <ColumnChart
                labels={months.map(mk => new Date(Number(mk.slice(0,4)), Number(mk.slice(5,7)) - 1, 1).toLocaleDateString("en-US", { month:"short" }))}
                series={[
                  { name:"Revenue", color: CHART_BLUE, values: months.map(mk => r2(byMonth[mk].rev)) },
                  { name:"Expenses", color: CHART_ORANGE, values: months.map(mk => r2(byMonth[mk].exp)) },
                ]}
                extra={i => { const n = r2(byMonth[months[i]].rev - byMonth[months[i]].exp);
                  return <div className="row" style={{borderTop:"1px solid #eef2f5",marginTop:4,paddingTop:4,fontWeight:600}}><span>Net</span><span style={{color: n < 0 ? "var(--coral)" : undefined}}>{fmtMoney(n)}</span></div>; }}
              />
            </div>
          )}

          <div className="card">
            <div className="card-header">
              <div className="card-title">Top Clients</div>
              <span style={{fontSize:12,color:"var(--slate-mid)"}}>revenue excl. tax · {periodLabel}</span>
            </div>
            <HBarChart rows={clientRows} />
          </div>

          <div className="card">
            <div className="card-header">
              <div className="card-title">Profit &amp; Loss</div>
              <span style={{fontSize:12,color:"var(--slate-mid)"}}>{BUSINESS.name} · {fmtDateY(from)} – {fmtDateY(to)} · {cash ? "cash" : "accrual"} basis</span>
            </div>
            <table className="rpt">
              <tbody>
                <tr><td><b>Income</b></td><td></td></tr>
                <tr className="sub"><td>Cleaning Service Revenue</td><td className="num">{fmtMoney(revenue)}</td></tr>
                <tr><td><b>Expenses</b></td><td></td></tr>
                {Object.keys(expByAcct).length === 0
                  ? <tr className="sub"><td>No expenses recorded</td><td className="num">{fmtMoney(0)}</td></tr>
                  : Object.entries(expByAcct).sort().map(([code, x]) => (
                      <tr key={code} className="sub"><td>{x.name}</td><td className="num">{fmtMoney(x.amt)}</td></tr>
                    ))}
                <tr className="sub"><td><b>Total Expenses</b></td><td className="num">{fmtMoney(totalExp)}</td></tr>
                <tr className="total"><td>Net Profit</td><td className={`num ${net < 0 ? "neg" : ""}`}>{fmtMoney(net)}</td></tr>
              </tbody>
            </table>
            {months.length > 1 && (
              <table className="rpt" style={{marginTop:8}}>
                <thead><tr><th>Month</th><th className="num">Revenue</th><th className="num">Expenses</th><th className="num">Net</th></tr></thead>
                <tbody>
                  {months.map(m => (
                    <tr key={m}><td>{monthLabel(m)}</td>
                      <td className="num">{fmtMoney(r2(byMonth[m].rev))}</td>
                      <td className="num">{fmtMoney(r2(byMonth[m].exp))}</td>
                      <td className={`num ${byMonth[m].rev - byMonth[m].exp < 0 ? "neg" : ""}`}>{fmtMoney(r2(byMonth[m].rev - byMonth[m].exp))}</td></tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>

          <div className="card">
            <div className="card-header">
              <div className="card-title">NJ Sales Tax — {year}</div>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <span style={{fontSize:12,color:"var(--slate-mid)"}}>Owed now: <b>{fmtMoney(taxOwed)}</b></span>
                <button className="btn btn-primary no-print" onClick={()=>setTaxPayForm({
                  date: todayStr, amount: taxOwed > 0 ? r2(taxOwed).toFixed(2) : "", method:"Check", reference:"", period: lastQLabel, options: quarterOptions,
                })}>💵 Pay NJ Sales Tax</button>
              </div>
            </div>
            <ColumnChart height={190}
              labels={quarters.map(q => q.label.split(" ")[0])}
              series={[
                { name:"Tax charged", color: CHART_BLUE, values: quarters.map(q => r2(q.charged)) },
                { name:"Tax collected", color: CHART_ORANGE, values: quarters.map(q => r2(q.collected)) },
              ]}
              extra={i => <div className="row" style={{borderTop:"1px solid #eef2f5",marginTop:4,paddingTop:4}}><span className="key">Paid to NJ</span><span>{fmtMoney(quarters[i].paidNJ)}</span></div>}
            />
            <table className="rpt">
              <thead><tr><th>Quarter</th><th className="num">Taxable sales</th><th className="num">Tax charged</th><th className="num">Tax collected</th><th className="num">Paid to NJ</th></tr></thead>
              <tbody>
                {quarters.map(q => (
                  <tr key={q.label}><td>{q.label}</td>
                    <td className="num">{fmtMoney(q.taxable)}</td><td className="num">{fmtMoney(q.charged)}</td>
                    <td className="num">{fmtMoney(r2(q.collected))}</td><td className="num">{fmtMoney(q.paidNJ)}</td></tr>
                ))}
                <tr className="total"><td>Total</td>
                  <td className="num">{fmtMoney(quarters.reduce((t,q)=>t+q.taxable,0))}</td>
                  <td className="num">{fmtMoney(quarters.reduce((t,q)=>t+q.charged,0))}</td>
                  <td className="num">{fmtMoney(r2(quarters.reduce((t,q)=>t+q.collected,0)))}</td>
                  <td className="num">{fmtMoney(quarters.reduce((t,q)=>t+q.paidNJ,0))}</td></tr>
              </tbody>
            </table>
            <div style={{fontSize:11,color:"var(--slate-mid)",padding:"10px 18px"}}>
              "Tax charged" counts invoices by invoice date; "Tax collected" counts the tax share of payments received; "Paid to NJ" counts each payment toward the quarter it covers.
            </div>
            <div className="card-header" style={{borderTop:"1px solid #eef2f5"}}>
              <div className="card-title" style={{fontSize:16}}>Payments to NJ — {year}</div>
              <span style={{fontSize:12,color:"var(--slate-mid)"}}>{taxPayments.length} recorded</span>
            </div>
            {taxPayments.length === 0
              ? <div className="chart-empty">No sales tax payments recorded for {year} yet.</div>
              : <table className="rpt">
                  <thead><tr><th>Date paid</th><th>Covers</th><th>Method</th><th>Check / EFT #</th><th className="num">Amount</th><th className="no-print"></th></tr></thead>
                  <tbody>
                    {taxPayments.map(x => (
                      <tr key={x.id}>
                        <td>{fmtDateY(x.expense_date)}</td>
                        <td>{x.tax_period || "—"}</td>
                        <td>{x.method || "—"}</td>
                        <td>{x.reference ? `#${x.reference}` : "—"}</td>
                        <td className="num">{fmtMoney(x.amount)}</td>
                        <td className="no-print" style={{width:36}}><button className="btn-icon danger" title="Remove" onClick={()=>handleDeleteExpense(x)}>🗑</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>}
          </div>

          <div className="card">
            <div className="card-header">
              <div className="card-title">Expenses — {periodLabel}</div>
              <span style={{fontSize:12,color:"var(--slate-mid)"}}>{periodExpenses.length} total</span>
            </div>
            {Object.keys(expByAcct).length > 0 && <HBarChart rows={Object.values(expByAcct).map(x => ({ label: x.name, value: r2(x.amt) }))} color={CHART_ORANGE} />}
            {periodExpenses.length === 0
              ? <div className="empty"><div className="empty-icon">🧾</div><div className="empty-text">No expenses in this period</div></div>
              : <table className="rpt">
                  <thead><tr><th>Date</th><th>Category</th><th>Vendor / note</th><th className="num">Amount</th><th className="no-print"></th></tr></thead>
                  <tbody>
                    {periodExpenses.map(x => (
                      <tr key={x.id}>
                        <td>{fmtDate(x.expense_date)}</td>
                        <td>{EXPENSE_CATEGORIES.find(c => c.code === acctById[x.account_id]?.code)?.label || acctById[x.account_id]?.name}</td>
                        <td>{[x.vendor, x.note].filter(Boolean).join(" — ")}</td>
                        <td className="num">{fmtMoney(x.amount)}</td>
                        <td className="no-print" style={{width:36}}><button className="btn-icon danger" title="Remove" onClick={()=>handleDeleteExpense(x)}>🗑</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>}
          </div>
        </div>
        )}
      </>
    );
  };

  const bookJobButton = isOwner ? <button className="btn btn-primary" onClick={()=>setShowBookModal(true)}>+ Book Job</button> : null;
  const topbarActions = {
    dashboard: bookJobButton,
    jobs:      bookJobButton,
    schedule:  bookJobButton,
    clients:   isOwner ? <button className="btn btn-primary" onClick={()=>setShowClientModal(true)}>+ Add Client</button> : null,
    notes:     <button className="btn btn-primary" onClick={()=>setShowNoteModal(true)}>+ Add Note</button>,
    team:      isOwner ? <button className="btn btn-primary" onClick={()=>setShowCleanerModal(true)}>+ Add Cleaner</button> : null,
    invoices:  isOwner && session ? <button className="btn btn-primary" onClick={()=>openNewInvoice()}>+ New Invoice</button> : null,
    books:     isOwner && session ? <button className="btn btn-primary" onClick={()=>setExpenseForm({ date: todayStr, amount:"", code:"5000", vendor:"", note:"" })}>+ Expense</button> : null,
  };

  const pages = { dashboard: renderDashboard, jobs: renderJobs, schedule: renderSchedule, clients: renderClients, notes: renderNotes, team: renderTeam, invoices: renderInvoices, books: renderBooks };

  return (
    <>
      <style>{styles}</style>
      {notif && <div className="notif">{notif}</div>}

      {/* OWNER SIGN-IN MODAL */}
      {showSignIn && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowSignIn(false)}>
          <form className="modal" onSubmit={e=>{ e.preventDefault(); handleSignIn(); }}>
            <div className="modal-header">
              <div className="modal-title">{signInForm.mode === "signup" ? "Create owner login" : "Owner sign-in"}</div>
              <button type="button" className="modal-close" onClick={()=>setShowSignIn(false)}>×</button>
            </div>
            <div className="modal-body">
              <div style={{fontSize:12,color:"var(--slate-mid)",marginBottom:14}}>
                Unlocks invoices on this device. Stays signed in until you sign out.
                {signInForm.mode === "signup" && " First time only: use the owner's email so the app recognizes you."}
              </div>
              <div className="form-group">
                <label className="form-label">Email</label>
                <input className="form-input" type="email" autoComplete="username" value={signInForm.email}
                  onChange={e=>setSignInForm(p=>({...p,email:e.target.value}))} />
              </div>
              <div className="form-group">
                <label className="form-label">Password</label>
                <input className="form-input" type="password" autoComplete={signInForm.mode === "signup" ? "new-password" : "current-password"}
                  value={signInForm.password} onChange={e=>setSignInForm(p=>({...p,password:e.target.value}))}
                  placeholder={signInForm.mode === "signup" ? "At least 6 characters" : ""} autoFocus />
              </div>
              {signInForm.msg && <div className="signin-msg">{signInForm.msg}</div>}
              <div style={{marginTop:12,fontSize:12}}>
                {signInForm.mode === "signin"
                  ? <a href="#" onClick={e=>{e.preventDefault(); setSignInForm(p=>({...p,mode:"signup",msg:""}));}}>First time? Create the owner login</a>
                  : <a href="#" onClick={e=>{e.preventDefault(); setSignInForm(p=>({...p,mode:"signin",msg:""}));}}>Already have a login? Sign in</a>}
              </div>
            </div>
            <div className="modal-footer">
              <button type="button" className="btn btn-ghost" onClick={()=>setShowSignIn(false)}>Cancel</button>
              <button type="submit" className="btn btn-primary" disabled={signInForm.busy}>
                {signInForm.busy ? "…" : signInForm.mode === "signup" ? "Create login" : "Sign in"}
              </button>
            </div>
          </form>
        </div>
      )}

      {/* INVOICE VIEW MODAL */}
      {viewInvoiceId && (() => {
        const inv = invoices.find(i => i.id === viewInvoiceId);
        if (!inv) return null;
        const c = clientById(inv.client_id) || {};
        const items = invoiceItems.filter(it => it.invoice_id === inv.id);
        const pmts = payments.filter(p => p.invoice_id === inv.id);
        const st = invoiceStatus(inv, todayStr);
        const imported = inv.source === "invoice_simple_import";
        const ratePct = (Number(inv.tax_rate) * 100).toFixed(3).replace(/\.?0+$/, "");
        return (
          <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setViewInvoiceId(null)}>
            <div className="modal modal-wide">
              <div className="modal-header no-print">
                <div className="modal-title">{inv.invoice_number} <span className={`badge badge-${st}`} style={{verticalAlign:"middle"}}><span className="badge-dot"></span>{st}</span></div>
                <button className="modal-close" onClick={()=>setViewInvoiceId(null)}>×</button>
              </div>
              <div className="inv-actions no-print">
                <button className="btn btn-primary" onClick={()=>window.print()}>🖨 Print / PDF</button>
                <button className="btn btn-ghost" onClick={()=>emailInvoice(inv)} disabled={!c.email} title={c.email ? "" : "Client has no email on file"}>✉️ Email</button>
                {Number(inv.balance_due) > 0 && (
                  <button className="btn btn-ghost" onClick={()=>setPaymentForm({ invoice_id: inv.id, balance: Number(inv.balance_due),
                    amount: Number(inv.balance_due).toFixed(2), date: todayStr, method: "Check", reference: "" })}>💵 Record Payment</button>
                )}
                {!imported && <button className="btn btn-ghost" onClick={()=>openEditInvoice(inv)}>✏️ Edit</button>}
                <button className="btn btn-danger" style={{marginLeft:"auto"}} onClick={()=>handleDeleteInvoice(inv)}>🗑 Delete</button>
              </div>
              <div className="invoice-doc">
                <div className="inv-head">
                  <div>
                    <div className="inv-biz-name">{BUSINESS.name}</div>
                    <div><Ph v={BUSINESS.address} /></div>
                    <div><Ph v={BUSINESS.phone} /> · <Ph v={BUSINESS.email} /></div>
                  </div>
                  <div>
                    <div className="inv-title">INVOICE</div>
                    <div className="inv-meta">
                      <div><span className="inv-label">Invoice # </span>{inv.invoice_number}</div>
                      <div><span className="inv-label">Date </span>{fmtDateY(inv.invoice_date)}</div>
                      <div><span className="inv-label">Due </span>{inv.due_date ? fmtDateY(inv.due_date) : DEFAULT_TERMS}</div>
                      {inv.po_number && <div><span className="inv-label">PO # </span>{inv.po_number}</div>}
                    </div>
                  </div>
                </div>
                <div className="inv-label">Bill To</div>
                <div style={{fontWeight:600,fontSize:15}}>{c.name}</div>
                {c.address && <div>{c.address}</div>}
                <div>{[c.phone || c.mobile, c.email].filter(Boolean).join(" · ")}</div>

                <table className="inv-table">
                  <thead><tr><th>Description</th><th className="num">Qty</th><th className="num">Rate</th><th className="num">Amount</th></tr></thead>
                  <tbody>
                    {imported && items.length === 0 ? (
                      <tr><td colSpan={3}>Cleaning services <span style={{color:"var(--slate-mid)",fontSize:11}}>(imported from Invoice Simple — line detail not available)</span></td><td className="num">{fmtMoney(inv.subtotal)}</td></tr>
                    ) : items.map(it => (
                      <tr key={it.id}>
                        <td>{it.description}{!it.taxable && <span style={{color:"var(--slate-mid)",fontSize:11}}> (non-taxable)</span>}</td>
                        <td className="num">{Number(it.quantity)}</td>
                        <td className="num">{fmtMoney(it.unit_price)}</td>
                        <td className="num">{fmtMoney(it.amount)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                <div className="inv-totals">
                  <div><span>Subtotal</span><span>{fmtMoney(inv.subtotal)}</span></div>
                  <div><span>Tax ({ratePct}%{Number(inv.taxable_amount) !== Number(inv.subtotal) ? ` on ${fmtMoney(inv.taxable_amount)}` : ""})</span><span>{fmtMoney(inv.tax_amount)}</span></div>
                  <div className="grand"><span>Total</span><span>{fmtMoney(inv.total)}</span></div>
                  {pmts.map(p => (
                    <div key={p.id} style={{color:"var(--slate-mid)"}}>
                      <span>Paid {fmtDateY(p.paid_date)}{p.method ? ` · ${p.method}` : ""}
                        <button className="no-print" title="Remove payment" onClick={()=>handleDeletePayment(p)}
                          style={{border:"none",background:"none",cursor:"pointer",color:"var(--coral)",marginLeft:4}}>×</button>
                      </span>
                      <span>−{fmtMoney(p.amount)}</span>
                    </div>
                  ))}
                  <div className="due"><span>Balance Due</span><span>{fmtMoney(inv.balance_due)}</span></div>
                </div>

                {inv.notes && <div style={{marginTop:22,whiteSpace:"pre-wrap"}}><div className="inv-label">Notes</div>{inv.notes}</div>}
                <div style={{marginTop:28,textAlign:"center",color:"var(--slate-mid)",fontSize:12}}><Ph v={INVOICE_FOOTER} /></div>
              </div>
            </div>
          </div>
        );
      })()}

      {/* INVOICE EDITOR MODAL */}
      {invoiceForm && (() => {
        const f = invoiceForm;
        const t = lineTotals(f.items, Number(f.tax_rate) || 0);
        const usedJobIds = new Set(f.items.map(l => l.job_id).filter(Boolean));
        const unbilled = f.client_id ? jobs.filter(j => j.client_id === f.client_id && j.status === "completed"
          && (!billedJobIds.has(j.id) || invoiceItems.some(it => it.job_id === j.id && it.invoice_id === f.id))
        ).sort((a,b)=>a.date.localeCompare(b.date)) : [];
        const setF = fn => setInvoiceForm(p => fn(p));
        const setLine = (i, patch) => setF(p => ({ ...p, items: p.items.map((l, k) => k === i ? { ...l, ...patch } : l) }));
        return (
          <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setInvoiceForm(null)}>
            <div className="modal modal-wide">
              <div className="modal-header">
                <div className="modal-title">{f.id ? `Edit ${f.invoice_number}` : "New Invoice"}</div>
                <button className="modal-close" onClick={()=>setInvoiceForm(null)}>×</button>
              </div>
              <div className="modal-body">
                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Client *</label>
                    <select className="form-select" value={f.client_id}
                      onChange={e=>setF(p=>({...p, client_id:e.target.value, items: p.items.filter(l => !l.job_id)}))}>
                      <option value="">Select a client…</option>
                      {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Invoice #</label>
                    <input className="form-input" value={f.invoice_number} onChange={e=>setF(p=>({...p,invoice_number:e.target.value}))} />
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Date</label>
                    <input className="form-input" type="date" value={f.invoice_date} onChange={e=>{
                      const d = e.target.value; const term = TERMS.find(x => x.label === f.terms);
                      setF(p=>({...p, invoice_date:d, due_date: term && d ? addDays(d, term.days) : p.due_date}));
                    }} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Terms</label>
                    <select className="form-select" value={f.terms} onChange={e=>{
                      const term = TERMS.find(x => x.label === e.target.value);
                      setF(p=>({...p, terms:e.target.value, due_date: term && p.invoice_date ? addDays(p.invoice_date, term.days) : p.due_date}));
                    }}>
                      <option value="">Custom due date</option>
                      {TERMS.map(x=><option key={x.label}>{x.label}</option>)}
                    </select>
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Due Date</label>
                    <input className="form-input" type="date" value={f.due_date} onChange={e=>setF(p=>({...p,due_date:e.target.value,terms:""}))} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">PO # (optional)</label>
                    <input className="form-input" value={f.po_number} onChange={e=>setF(p=>({...p,po_number:e.target.value}))} />
                  </div>
                </div>

                {f.client_id && (
                  <div className="form-group">
                    <label className="form-label">Completed jobs not yet invoiced</label>
                    {unbilled.length === 0
                      ? <div style={{fontSize:12,color:"var(--slate-mid)"}}>None — add lines by hand below.</div>
                      : unbilled.map(j => (
                          <label key={j.id} className="job-pick">
                            <input type="checkbox" checked={usedJobIds.has(j.id)} onChange={e=>{
                              if (e.target.checked) setF(p=>({...p, items:[...p.items, jobLine(j)]}));
                              else setF(p=>({...p, items:p.items.filter(l=>l.job_id!==j.id)}));
                            }} />
                            <span style={{flex:1}}>{fmtDate(j.date)} · {j.type}{j.address ? ` · ${j.address}` : ""}</span>
                            <span style={{color:"var(--slate-mid)"}}>{j.price !== null && j.price !== undefined ? fmtMoney(j.price) : "no price"}</span>
                          </label>
                        ))}
                  </div>
                )}

                <div className="form-group">
                  <label className="form-label">Line items</label>
                  <div className="line-grid head"><span>Description</span><span>Qty</span><span>Rate</span><span>Tax</span><span></span></div>
                  {f.items.map((l, i) => (
                    <div key={i} className="line-grid">
                      <input className="form-input" value={l.description} onChange={e=>setLine(i,{description:e.target.value})} placeholder="Description" />
                      <input className="form-input" type="number" step="0.01" inputMode="decimal" value={l.quantity} onChange={e=>setLine(i,{quantity:e.target.value})} />
                      <input className="form-input" type="number" step="0.01" inputMode="decimal" value={l.unit_price} onChange={e=>setLine(i,{unit_price:e.target.value})} />
                      <input type="checkbox" title="Taxable" checked={!!l.taxable} onChange={e=>setLine(i,{taxable:e.target.checked})} style={{justifySelf:"center"}} />
                      <button className="btn-icon danger" title="Remove line" onClick={()=>setF(p=>({...p, items:p.items.filter((_,k)=>k!==i)}))}>×</button>
                    </div>
                  ))}
                  <button className="btn btn-ghost" style={{marginTop:6}}
                    onClick={()=>setF(p=>({...p, items:[...p.items, { description:"", quantity:1, unit_price:"", taxable:true, job_id:null }]}))}>+ Add Line</button>
                </div>

                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Sales tax %</label>
                    <input className="form-input" type="number" step="0.001" value={+(Number(f.tax_rate) * 100).toFixed(4)}
                      onChange={e=>setF(p=>({...p, tax_rate: (Number(e.target.value) || 0) / 100}))} />
                  </div>
                  <div className="inv-totals" style={{alignSelf:"end"}}>
                    <div><span>Subtotal</span><span>{fmtMoney(t.subtotal)}</span></div>
                    <div><span>Tax</span><span>{fmtMoney(t.tax)}</span></div>
                    <div className="grand"><span>Total</span><span>{fmtMoney(t.total)}</span></div>
                  </div>
                </div>
                <div className="form-group">
                  <label className="form-label">Notes (shown on invoice)</label>
                  <textarea className="form-textarea" value={f.notes} onChange={e=>setF(p=>({...p,notes:e.target.value}))} />
                </div>
              </div>
              <div className="modal-footer">
                <button className="btn btn-ghost" onClick={()=>setInvoiceForm(null)}>Cancel</button>
                <button className="btn btn-primary" onClick={handleSaveInvoice}>{f.id ? "Save Changes" : "Create Invoice"}</button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* RECORD PAYMENT MODAL */}

            {topbarActions[activeNav]}
            <div className="user-menu-wrap">
              <div className="avatar" style={{cursor:"pointer", background: currentUser ? colorFor(currentUser.id) : "var(--ocean)"}}
                onClick={()=>setShowUserMenu(v=>!v)}>
                {currentUser?.name?.[0] || "?"}
              </div>
              {showUserMenu && (
                <div className="user-menu" onMouseLeave={()=>setShowUserMenu(false)}>
                  <div className="user-menu-header">{currentUser?.name}{session && <div style={{fontSize:11}}>🔓 Owner: {session.user.email}</div>}</div>
                  {isOwner && !session && <div className="user-menu-item" onClick={openSignIn}>Sign in as owner</div>}
                  {session && <div className="user-menu-item" onClick={handleSignOut}>Sign out of owner</div>}
                  <div className="user-menu-item" onClick={()=>{ if (session) supabase.auth.signOut(); localStorage.removeItem(USER_KEY); setCurrentUser(null); setShowUserMenu(false); }}>Switch user</div>
                  <div className="user-menu-item" onClick={()=>{ if (session) supabase.auth.signOut(); localStorage.removeItem(USER_KEY); localStorage.removeItem(TRUST_KEY); setCurrentUser(null); setTrusted(false); setShowUserMenu(false); }}>Lock device</div>
                </div>
              )}
            </div>
          </div>
        </div>

        {/* NAV BAR */}
        <div className="navbar">
          <div className="nav-tabs">
            {navItems.map(n => (
              <div key={n.id} className={`nav-item ${activeNav===n.id?"active":""}`} onClick={()=>setActiveNav(n.id)}>
                <span className="nav-icon">{n.icon}</span>
                <span>{n.label}</span>
              </div>
            ))}
          </div>
        </div>

        {/* MAIN */}
        <div className="main">
          <div className="content">
            {loading
              ? <div className="empty"><div className="empty-icon">⏳</div><div className="empty-text">Loading…</div></div>
              : pages[activeNav]?.()
            }
          </div>
          <div className="app-footer">r{APP_REV}</div>
        </div>
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<JannasDashboard />);
</script>
</body>
</html>
